<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Directory</title>

    <link rel="icon" href="/resources/mgpi-logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {

            background:
                linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)),
                url("back.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;
        }

        #head {

            width: 95%;
            margin: 20px auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255, 255, 255, .92);

            padding: 18px 25px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);

        }

        #head h2 {

            color: #1565c0;
            font-size: 28px;

        }

        #homeBtn {

            border: none;

            padding: 11px 20px;

            border-radius: 8px;

            background: #1565c0;

            color: white;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;

            transition: .25s;

        }

        #homeBtn:hover {

            background: #ff9800;
            color: black;

        }

        .container {

            width: 95%;

            margin: auto;

            background: rgba(255, 255, 255, .12);

            backdrop-filter: blur(12px);

            border-radius: 18px;

            padding: 25px;

        }

        .topBar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 15px;

            margin-bottom: 25px;

        }

        .title {

            color: white;

            font-size: 28px;

            font-weight: bold;

        }

        #count {

            color: #ffd166;

            margin-top: 5px;

        }

        #search {

            width: 330px;

            max-width: 100%;

            padding: 12px 16px;

            border: none;

            border-radius: 40px;

            outline: none;

            font-size: 15px;

        }

        #studentList {

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));

            gap: 20px;

        }

        .card {

            background: white;

            border-radius: 15px;

            padding: 20px;

            transition: .25s;

            border: 2px solid transparent;

            cursor: pointer;

        }

        .card:hover {

            transform: translateY(-4px);

            border-color: #ff9800;

        }

        .name {

            color: #1565c0;

            font-size: 22px;

            font-weight: 700;

            margin-bottom: 8px;

        }

        .roll {

            color: #666;

            margin-bottom: 12px;

        }

        .row {

            display: flex;

            justify-content: space-between;

            margin: 8px 0;

            font-size: 15px;

        }

        .label {

            color: #666;

        }

        .value {

            font-weight: 600;

        }

        .male {

            color: #1565c0;

            font-weight: bold;

        }

        .female {

            color: #e91e63;

            font-weight: bold;

        }

        .cgpa {

            color: #2e7d32;

            font-weight: bold;

        }

        .profileBtn {

            margin-top: 18px;

            width: 100%;

            border: none;

            padding: 11px;

            border-radius: 8px;

            background: #1565c0;

            color: white;

            cursor: pointer;

            font-weight: bold;

            transition: .25s;

        }

        .profileBtn:hover {

            background: #ff9800;

            color: black;

        }

        @media(max-width:700px) {

            #head {

                flex-direction: column;

                gap: 15px;

                text-align: center;

            }

            .topBar {

                flex-direction: column;

            }

            #search {

                width: 100%;

            }

        }
    </style>

</head>

<body>

    <div id="head">
        <button id="homeBtn" onclick="location.href='index.html'">

            🏠 Home

        </button>
        <h2>🎓 MPGI - MCA II (2025-2027)</h2>



    </div>

    <div class="container">

        <div class="topBar">

            <div>

                <div class="title">

                    👨‍🎓 Student Directory

                </div>

                <div id="count"></div>

            </div>

            <input id="search" type="text" placeholder="🔍 Search by Name, Roll No or Phone">

        </div>

        <div id="studentList"></div>

    </div>

    <script src="studentdetails.js"></script>

    <script>

        const list = document.getElementById("studentList");

        const count = document.getElementById("count");

        function render(data) {

            count.innerHTML = "Total Students : <b>" + data.length + "</b>";

            list.innerHTML = "";

            data.forEach(student => {

                list.innerHTML += `

        <div class="card">

            <div class="name">

                👤 ${student.name}

            </div>

            <div class="roll">

                Roll No : ${student.rollNo}

            </div>

            <div class="row">

                <span class="label">

                    Course

                </span>

                <span class="value">

                    ${student.course}

                </span>

            </div>

            <div class="row">

                <span class="label">

                    Gender

                </span>

                <span class="${student.gender == "Male" ? "male" : "female"}">

                    ${student.gender}

                </span>

            </div>

            <div class="row">

                <span class="label">

                    Phone

                </span>

                <span class="value">

                    ${student.phone}

                </span>

            </div>

            <div class="row">

                <span class="label">

                    CGPA-II

                </span>

                <span class="cgpa">

                    ${student.cgpa2}

                </span>

            </div>

            <button

            class="profileBtn"

            onclick="location.href='student.html?id=${student.rollNo}'">

                View Full Profile →

            </button>

        </div>

        `;

            });

        }

        render(students);

        search.onkeyup = function () {

            const value = this.value.toLowerCase();

            render(

                students.filter(student =>

                    student.name.toLowerCase().includes(value)

                    ||

                    student.rollNo.toString().includes(value)

                    ||

                    student.phone.toString().includes(value)

                )

            );

        }

    </script>

</body>

</html>
