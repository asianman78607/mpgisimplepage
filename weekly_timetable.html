<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Weekly Time Table</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;

            font-family: Poppins, sans-serif
        }

        body {
            background: linear-gradient(135deg, #1d3557, #457b9d, #1d3557);
            min-height: 100vh;
            padding: 35px;
            color: #fff
        }

        .container {
            max-width: 1100px;
            margin: auto
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .info {
            margin: 12px 0 25px;
            color: #ffd166
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer
        }

        .days {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        .day {
            padding: 10px 18px;
            background: rgba(255, 255, 255, .15);
            border-radius: 10px;
            cursor: pointer
        }

        .active {
            background: #ff9800;
            color: #000;
            font-weight: 700
        }

        .cards {
            display: grid;
            gap: 16px
        }

        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            background: rgba(255, 255, 255, .12);
            border-radius: 12px;
            border: 3px solid transparent;
        }

      

        .current {
            border: 3px solid #00ff88
        }

        .completed {
            opacity: .55
        }

        .lunch {
            justify-content: center;
            background: #ffe39a;
            color: #222;
            font-weight: 700
        }

        .room {
            width: max-content;
            background: #ff9800;
            color: #000;
            padding: 5px 10px;
            border-radius: 6px;
            margin-top: 8px
        }

        .now {
            width: max-content;

            background: #00b050;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            margin-bottom: 8px
        }

        .light {
            background: #f4f7fc;
            color: #222
        }

        .light .card {
            background: #fff;
            color: #222
        }

        .light .day {
            background: #ddd
        }

        .light .active {
            background: #1565c0;
            color: #fff
        }
        .subject{
    font-size:22px;
    font-weight:700;
    color:#ffffff;
    margin-bottom:8px;
    line-height:1.3;
}

.teacher{
    font-size:15px;
    color:#d8e3f3;
    margin-bottom:8px;
}

.room{
    font-size:14px;
}
.light .subject{
    color:#1565c0;
}

.light .teacher{
    color:#555;
}

.light .time{
    color:#1565c0;
}

.light #info{
    color:#444;
}

.light h1{
    color:#222;
}

.light .room{
    background:#1565c0;
    color:white;
}

.light .now{
    background:#28a745;
    color:white;
}
.light .card{
    border: 3px rgb(197, 198, 240) solid;
}
  .card:hover {
            transform: translateY(-3px);
     border-color:rgb(64, 66, 203);

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Weekly Time Table</h1>
                <div id="info" class="info"></div>
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="location.href='index.html'">🏠 Home</button>
                <button id="themeBtn">Light Theme</button>
            </div>
        </div>
        <div id="days" class="days"></div>
        <div id="cards" class="cards"></div>
    </div>
    <script src="timetable-data.js"></script>
    <script>
        const week = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];




        const days = document.getElementById("days");
        const cards = document.getElementById("cards");
        const info = document.getElementById("info");

        //Sunday is 0
        const jsDay = new Date().getDay();

        let today = null;
        let selected = "Monday";

        if (jsDay >= 1 && jsDay <= 6) {
            today = week[jsDay - 1];
            selected = today;
        }

        function toMinutes(time) {

            let [clock, ampm] = time.split(" ");
            let [h, m] = clock.split(":").map(Number);

            if (ampm === "PM" && h !== 12)
                h += 12;

            if (ampm === "AM" && h === 12)
                h = 0;

            return h * 60 + m;

        }

        function renderDays() {

            days.innerHTML = "";

            week.forEach(day => {

                const div = document.createElement("div");

                div.className = "day";

                if (day === selected) {
                    div.classList.add("active");
                }


                div.innerText = day;

                div.onclick = () => {

                    selected = day;

                    renderDays();

                    renderCards(false);

                };

                days.appendChild(div);

            });

        }

        function renderCards(scroll = true) {

            const now = new Date();

            const currentMinutes =
                now.getHours() * 60 +
                now.getMinutes();
            let z = now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            })
            if (today == null) {

                info.innerHTML =
                    "Today : Sunday (Holiday) | Current Time : " +
                    z;

            }
            else {

                info.innerHTML =
                    "Today : " + today +
                    " | Current Time : " +
                    z;

            }

            cards.innerHTML = "";

            let alreadyScrolled = false;

            timetable[selected].forEach(period => {
                console.log(period);
                const card = document.createElement("div");

                if (period.subject === "Lunch") {

                    card.className = "card lunch";

                    card.innerHTML = `
                <div>
                    <h2>🍽 Lunch Break</h2>
                    ${period.start} - ${period.end}
                </div>
            `;

                    if (
                        today === selected &&
                        currentMinutes >= toMinutes(period.start) &&
                        currentMinutes < toMinutes(period.end)
                    ) {
                        card.classList.add("current");
                    }

                }
                else {

                    let className = "card";

                    let badge = "";

                    const start = toMinutes(period.start);
                    const end = toMinutes(period.end);

                    if (today === selected) {

                        if (currentMinutes >= end) {
                            className += " completed";
                        }

                        if (
                            currentMinutes >= start &&
                            currentMinutes < end
                        ) {

                            className += " current";

                            badge = `<div class="now">NOW</div>`;

                        }

                    }

                    card.className = className;

                    card.innerHTML = `

                <div>

                    ${badge}

                   <div class="subject">
    ${period.room === "Narayan Murthy Lab 3" ? "🧪" :
                            period.subject.includes("Practice") ? "💻" :
                                period.subject === "NF1" ? "📖" :
                                    period.subject.includes("VA") ? "📝" :
                                        period.subject.includes("Quantitative") ? "📊" :
                                            period.subject.includes("LR/DI") ? "🧠" :
                                                period.subject.includes("Digi") ? "💡" :
                                                    "📘"} <b>${period.subject}</b>
</div>

${period.teacher ? `
<div class="teacher">
    👨‍🏫 ${period.teacher}
</div>` : ""}

${period.room ? `
<div class="room">
    📍 ${period.room}
</div>` : ""}

                </div>

                <div class="time">
                    ${period.start}<br>
                    to<br>
                    ${period.end}
                </div>

            `;

                }

                cards.appendChild(card);

                if (
                    scroll &&
                    !alreadyScrolled &&
                    card.classList.contains("current")
                ) {

                    alreadyScrolled = true;

                    setTimeout(() => {

                        card.scrollIntoView({

                            behavior: "smooth",

                            block: "center"

                        });

                    }, 200);

                }

            });

        }

        renderDays();

        renderCards();

        setInterval(() => {

            renderCards(false);
            const now = new Date();

            if (today == null) {

                info.innerHTML =
                    "Today : Sunday (Holiday) | Current Time : " +
                    now.toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    })

            }
            else {

                info.innerHTML =
                    "Today : " + today +
                    " | Current Time : " +
                    now.toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    })

            }
        }, 60000);



        themeBtn.onclick = function () {

            document.body.classList.toggle("light");

            this.innerText =
                document.body.classList.contains("light")
                    ? "Dark Theme"
                    : "Light Theme";

        };





    </script>
</body>

</html>
