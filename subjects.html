<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MCA Semester III Syllabus</title>

    <script src="subjects.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            background: linear-gradient(135deg, #eef5ff, #dfefff);
            padding: 30px;
        }

        h1 {

            text-align: center;
            color: #1f3c88;
            margin-bottom: 35px;
            font-size: 38px;
        }

        #homeBtn {

            position: fixed;
            top: 20px;
            left:  20px;

            border: none;
            background: #1f3c88;
            color: white;

            padding: 12px 22px;

            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;

            transition: .3s;

            box-shadow: 0 5px 15px rgba(0, 0, 0, .18);
            z-index: 999;
        }

        #homeBtn:hover {

            background: #15306e;
            transform: translateY(-2px);
        }

        .container {

            max-width: 1400px;
            margin: auto;

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));

            gap: 28px;
        }

        .card {

            background: white;
            border-radius: 18px;
            overflow: hidden;

            box-shadow: 0 12px 25px rgba(0, 0, 0, .08);

            transition: .3s;
        }

        .card:hover {

            transform: translateY(-6px);
        }

        .top {

            background: linear-gradient(135deg, #1f3c88, #2962ff);

            color: white;

            padding: 22px;
        }

        .top h2 {

            margin-bottom: 8px;
            font-size: 26px;
        }

        .code {

            display: inline-block;

            background: rgba(255, 255, 255, .18);

            padding: 6px 12px;
            border-radius: 25px;

            margin-bottom: 12px;
            font-size: 14px;
        }

        .info {

            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;

            margin-top: 15px;

            font-size: 15px;
        }

        .info span {

            background: rgba(255, 255, 255, .15);

            padding: 7px 12px;
            border-radius: 8px;
        }

        .body {

            padding: 20px;
        }

        details {

            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        summary {

            cursor: pointer;
            list-style: none;

            padding: 15px;

            background: #edf3ff;

            font-weight: bold;

            color: #1f3c88;

            font-size: 18px;
        }

        summary::-webkit-details-marker {

            display: none;
        }

        summary::after {

            content: "▼";
            float: right;
            transition: .3s;
        }

        details[open] summary::after {

            transform: rotate(180deg);
        }

        .unit {

            padding: 18px;
            border-top: 1px solid #ececec;
        }

        .unitHead {

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 12px;
            gap: 10px;
        }

        .unit h3 {

            color: #1f3c88;
            font-size: 19px;
        }

        .lecture {

            background: #2962ff;
            color: white;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 13px;
        }

        .content {

            color: #555;
            line-height: 1.8;
            text-align: justify;
        }

        .practical {

            text-align: center;
            color: #666;
            font-size: 17px;
            padding: 15px;
        }

        @media(max-width:700px) {

            body {

                padding: 15px;
            }

            h1 {

                font-size: 28px;
            }

            .container {

                grid-template-columns: 1fr;
            }

            #homeBtn {

                top: 12px;
                right: 12px;
                padding: 10px 16px;
            }
        }
    </style>

</head>

<body>

    <button id="homeBtn" onclick="location.href='index.html'">
        🏠 Home
    </button>

    <h1>📚 MCA Semester III Syllabus</h1>

    <div class="container" id="subjectsContainer"></div>
    <script src="subjectsdata.js"></script>
    <script>

        const container = document.getElementById("subjectsContainer");

        semester3Subjects.forEach(subject => {

            let html = `

            <div class="card">

                <div class="top">

                    <div class="code">${subject.code}</div>

                    <h2>${subject.name}</h2>

                    <div class="info">

                        <span>🎯 ${subject.type}</span>

                        <span>⭐ ${subject.credits} Credits</span>

                        <span>📖 LTP : ${subject.ltp}</span>

                    </div>

                </div>

                <div class="body">

            `;

            if (subject.syllabus) {

                html += `<details open>

                        <summary>Detailed Syllabus</summary>`;

                subject.syllabus.forEach(unit => {

                    html += `

                    <div class="unit">

                        <div class="unitHead">

                            <h3>${unit.unit} : ${unit.title}</h3>

                            <span class="lecture">${unit.lectures} Lectures</span>

                        </div>

                        <div class="content">

                            ${unit.content}

                        </div>

                    </div>

                    `;

                });

                html += `</details>`;

            }
            else {

                html += `

                <div class="practical">

                    Practical / Project Course

                </div>

                `;
            }

            html += `

                </div>

            </div>

            `;

            container.innerHTML += html;

        });

    </script>

</body>

</html>
